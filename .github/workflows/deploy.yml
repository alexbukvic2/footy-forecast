name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:        # also allow manual trigger from UI

permissions:
  id-token: write           # required for OIDC
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false # don't cancel mid-deploy

jobs:
  ci:
    name: CI checks
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to production
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://footy-forecast.hexagonon.net
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary (linux/arm64)
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=arm64 CGO_ENABLED=0 go build \
            -trimpath \
            -ldflags="-s -w -X main.buildSHA=${GITHUB_SHA}" \
            -o dist/server \
            ./cmd/server
          file dist/server

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-actions-deploy-${{ github.run_id }}
          aws-region: eu-central-1

      - name: Upload binary to S3
        run: |
          KEY="builds/server-${GITHUB_SHA}"
          aws s3 cp dist/server "s3://${{ secrets.AWS_DEPLOY_BUCKET }}/${KEY}"
          echo "S3_KEY=${KEY}" >> "$GITHUB_ENV"

      - name: Upload migrations to S3
        run: |
          aws s3 sync ./migrations/ "s3://${{ secrets.AWS_DEPLOY_BUCKET }}/migrations/" --delete

      - name: Trigger deploy on EC2 via SSM
        id: ssm
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.AWS_EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --parameters "commands=[\"bash /usr/local/bin/footy-forecast-deploy ${S3_KEY}\"]" \
            --comment "Deploy ${GITHUB_SHA::7}" \
            --query 'Command.CommandId' \
            --output text)
          echo "COMMAND_ID=${COMMAND_ID}" >> "$GITHUB_ENV"
          echo "Deploy command: ${COMMAND_ID}"

      - name: Wait for deploy to finish
        run: |
          for i in {1..60}; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${{ secrets.AWS_EC2_INSTANCE_ID }}" \
              --query 'Status' \
              --output text 2>/dev/null || echo "Pending")
            echo "Attempt ${i}: ${STATUS}"
            case "$STATUS" in
              Success)
                echo "Deploy succeeded"
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                echo "Deploy ended with status: ${STATUS}"
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${{ secrets.AWS_EC2_INSTANCE_ID }}" \
                  --query '{StdOut: StandardOutputContent, StdErr: StandardErrorContent}' \
                  --output json
                exit 1
                ;;
            esac
            sleep 5
          done
          echo "Deploy timed out after 5 minutes"
          exit 1

      - name: Show deploy output
        if: always()
        run: |
          aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${{ secrets.AWS_EC2_INSTANCE_ID }}" \
            --query '{Status: Status, StdOut: StandardOutputContent, StdErr: StandardErrorContent}' \
            --output json

      - name: Smoke test
        run: |
          curl -fsS --max-time 10 https://footy-forecast.hexagonon.net/health/ready
          curl -fsS --max-time 10 https://footy-forecast.hexagonon.net/health
          echo "Smoke test passed"
