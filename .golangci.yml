version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - errcheck
    - gosec
    - revive
    - staticcheck
    - unused
    - misspell
    - gocritic
    - gocyclo
    - bodyclose
    - prealloc

linters-settings:
  gocyclo:
    min-complexity: 15

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - gosec
        - gocyclo
