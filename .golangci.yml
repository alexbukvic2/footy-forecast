version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - errcheck
    - gosec
    - revive
    - staticcheck
    - unused
    - misspell
    - gocritic
    - gocyclo
    - bodyclose
    - prealloc
  settings:
    gocyclo:
      min-complexity: 15
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - gocyclo
      - path: cmd/seed/
        linters:
          - revive
          - unused
          - gosec
          - gocritic
