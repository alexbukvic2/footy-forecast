services:
  postgres:
    image: postgres:16-alpine
    container_name: footy-forecast-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: footy
      POSTGRES_PASSWORD: footy_dev_password
      POSTGRES_DB: footy_forecast
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U footy -d footy_forecast"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
