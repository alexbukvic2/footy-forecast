  /leagues/{id}/members/{userId}:
    delete:
      summary: Remove a member from a league
      operationId: removeLeagueMember
      tags: [leagues]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: userId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Member removed
        '400':
          description: Invalid UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Not the league owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: League or member not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /tournaments/{tournament_id}/players/search:
    get:
      summary: Search players in a tournament
      operationId: searchPlayers
      tags: [players]
      security:
        - bearerAuth: []
      parameters:
        - name: tournament_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: group
          in: query
          required: false
          description: Filter results to players whose team is in this group (e.g. "A"). Omit to search all groups.
          schema:
            type: string
        - name: hasHandicap
          in: query
          required: false
          description: When true, only return players that have at least one handicap row.
          schema:
            type: boolean
      responses:
        '200':
          description: Matching players
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayerListResponse'
        '400':
          description: Invalid tournament ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Tournament not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
