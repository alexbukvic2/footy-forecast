$kind: http-request
name: List Score Predictions
method: GET
url: "{{baseUrl}}/leagues/{{leagueId}}/predictions?n=1&skip=2"
queryParams:
  - key: n
    value: "1"
  - key: skip
    value: "2"
auth:
  type: noauth
order: 6000
headers:
  Authorization: Bearer {{authToken}}
params:
  - key: n
    value: '3'
    description: Number of days-with-fixtures per page
    disabled: true
  - key: skip
    value: '0'
    description: Number of most-recent days-with-fixtures to skip (requires n)
    disabled: true
