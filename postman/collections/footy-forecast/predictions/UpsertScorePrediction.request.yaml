$kind: http-request
name: Upsert Score Prediction
method: PUT
url: '{{baseUrl}}/predictions/{{fixtureId}}'
auth:
  type: noauth
order: 1000
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "goals_home": 2,
      "goals_away": 1,
      "winner": null
    }
