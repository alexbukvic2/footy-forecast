$kind: http-request
name: Upsert Score Prediction
method: PUT
url: '{{baseUrl}}/predictions/{{fixtureId}}'
order: 1000
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "goals_home": 2,
      "goals_away": 1
    }
scripts:
  - type: afterResponse
    code: |-
      var jsonData = pm.response.json();
      pm.environment.set("predictionId", jsonData.id);
    language: text/javascript
