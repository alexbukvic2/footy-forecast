$kind: http-request
name: List League Group Predictions
method: GET
url: "{{baseUrl}}/leagues/{{leagueId}}/predictions/groups?group=B"
queryParams:
  group: B
auth:
  type: noauth
order: 3000
headers:
  Authorization: Bearer {{authToken}}
params:
  - key: group
    value: A
    description: Group letter (e.g. "A")
