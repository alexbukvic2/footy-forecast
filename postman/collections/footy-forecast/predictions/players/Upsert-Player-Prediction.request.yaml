$kind: http-request
name: Bulk Upsert Player Predictions
method: PUT
url: "{{baseUrl}}/tournaments/{{tournamentId}}/predictions/players"
auth:
  type: noauth
order: 1000
headers:
  - key: Authorization
    value: "Bearer {{authToken}}"
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    [
      { "category": "group_top_scorer", "group_letter": "A", "player_id": "{{playerId}}" },
      { "category": "total_top_scorer", "group_letter": null, "player_id": "{{playerId}}" }
    ]
