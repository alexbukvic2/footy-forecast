$kind: http-request
name: Upsert Team Prediction
method: PUT
url: "{{baseUrl}}/tournaments/{{tournamentId}}/predictions/teams/winner"
auth:
  type: noauth
order: 1000
headers:
  - key: Authorization
    value: "Bearer {{authToken}}"
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "team_id": "{{teamId}}"
    }
