$kind: http-request
name: Bulk Upsert Team Predictions
method: PUT
url: "{{baseUrl}}/tournaments/{{tournamentId}}/predictions/teams"
auth:
  type: noauth
order: 1000
headers:
  Authorization: Bearer {{authToken}}
  Content-Type: application/json
body:
  type: json
  content: |-
    [
      { "category": "group_winner", "group_letter": "A", "slot_index": 0, "team_id": "{{teamId}}" },
      { "category": "playoff", "group_letter": "A", "slot_index": 0, "team_id": "{{teamId}}" },
      { "category": "semifinalist", "group_letter": null, "slot_index": 0, "team_id": "{{teamId}}" },
      { "category": "winner", "group_letter": null, "slot_index": 0, "team_id": "{{teamId}}" }
    ]
