$kind: http-request
name: Create Tournament
method: POST
url: "{{baseUrl}}/tournaments"
auth:
  type: bearer
  credentials:
    token: "{{authToken}}"
order: 1000
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "slug": "fifa-world-cup-2026",
      "name": "FIFA World Cup 2026",
      "starts_at": "2026-06-11T00:00:00Z",
      "ends_at": "2026-07-19T00:00:00Z"
    }
