$kind: http-request
name: Create Tournament
method: POST
url: '{{baseUrl}}/tournaments'
order: 1000
headers:
  - key: Authorization
    value: 'Bearer {{authToken}}'
  - key: Content-Type
    value: application/json
scripts:
  - type: afterResponse
    code: |-
      var jsonData = pm.response.json();
      pm.environment.set("tournamentId", jsonData.id);
    language: text/javascript
body:
  type: json
  content: |-
    {
      "slug": "world-cup-2026",
      "name": "World Cup 2026",
      "starts_at": "2026-06-11T00:00:00Z",
      "ends_at": "2026-07-19T00:00:00Z"
    }
