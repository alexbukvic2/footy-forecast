$kind: http-request
name: Patch Me (display name / timezone / silent window)
method: PATCH
url: "{{baseUrl}}/users/me"
order: 2000
headers:
  Authorization: Bearer {{authToken}}
  Content-Type: application/json
body:
  mode: raw
  raw: |
    {
      "display_name": "{{displayName}}",
      "timezone": "Europe/London",
      "silent_from": "22:00",
      "silent_until": "08:00"
    }
